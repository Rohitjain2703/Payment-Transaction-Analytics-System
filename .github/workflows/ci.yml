name: QA Pipeline

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate ML environment
        run: |
          python -c "import pandas, numpy, sklearn, xgboost, lightgbm, shap; print('ML environment OK')"

      - name: Validate FastAPI
        run: |
          python -c "from api.main import app; print('FastAPI application OK')"